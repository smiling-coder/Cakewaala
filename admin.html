<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body>
<section id="login"><h2>Admin login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="m"></p></section>
<section id="panel" hidden><button onclick="out()">Logout</button><h3 id="st"></h3>
<h3>Orders</h3><input id="oq" placeholder="Search order / name / phone" oninput="orders()"><select id="os" onchange="orders()"><option value="">All</option><option>Pending</option><option>Confirmed</option><option>Preparing</option><option>Out for delivery</option><option>Delivered</option><option>Cancelled</option></select><div style="overflow:auto"><table id="ot"></table></div>
<h3>Products</h3><form id="pf"><input name="name" placeholder="Name" required><input name="category" placeholder="Category" required><input name="price" type="number" step="0.01" placeholder="Price" required><input name="unit" placeholder="kg / piece" value="kg"><textarea name="description" placeholder="Description"></textarea><input name="image" type="file" accept="image/*"><button>Add product</button></form><div style="overflow:auto"><table id="pt"></table></div></section>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let csrf='';
const api=(u,o={})=>fetch(u,{...o,headers:{...(o.body&&typeof o.body=='string'?{'Content-Type':'application/json'}:{}),'X-CSRF-Token':csrf,...o.headers}});
async function show(){$('#login').hidden=true;$('#panel').hidden=false;const s=await (await api('/api/admin/stats')).json();$('#st').textContent=`Orders ${s.total} · Pending ${s.pending} · Delivered ${s.completed} · Paid sales ₹${s.sales_paid} · Products ${s.products}`;orders();prods()}
async function login(){const r=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#u').value,password:$('#p').value})}),d=await r.json();if(!r.ok){$('#m').textContent=d.error;return}csrf=d.csrf;show()}
async function out(){await api('/api/admin/logout',{method:'POST'});location.reload()}
async function orders(){const r=await api(`/api/admin/orders?q=${encodeURIComponent($('#oq').value)}&status=${encodeURIComponent($('#os').value)}`),L=await r.json();
$('#ot').innerHTML='<tr><th>#</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Paid?</th></tr>'+L.map(o=>`<tr><td>${esc(o.order_number)}<br>${o.delivery_date} ${o.delivery_time}</td><td>${esc(o.customer_name)}<br>${esc(o.phone)}<br>${esc(o.address)}<br><i>${esc(o.notes)}</i></td><td>${o.items.map(i=>esc(i.name)+' ×'+i.quantity).join('<br>')}</td><td>₹${o.total_amount}<br>${o.payment_method}</td><td><select onchange="up(${o.id},{order_status:this.value})">${['Pending','Confirmed','Preparing','Out for delivery','Delivered','Cancelled'].map(s=>`<option ${s==o.order_status?'selected':''}>${s}</option>`).join('')}</select></td><td><input type="checkbox" ${o.payment_status=='paid'?'checked':''} onchange="up(${o.id},{payment_status:this.checked?'paid':'pending'})"></td></tr>`).join('')}
async function up(id,b){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify(b)});show()}
async function prods(){const L=await (await fetch('/api/products')).json();$('#pt').innerHTML=L.map(p=>`<tr><td>${esc(p.name)}</td><td>₹${p.price}/${esc(p.unit)}</td><td><button onclick="price(${p.id})">Price</button> <button onclick="av(${p.id},${!p.is_available})">${p.is_available?'Mark sold out':'Mark available'}</button> <button onclick="del(${p.id})">Delete</button></td></tr>`).join('')}
async function price(id){const v=prompt('New price');if(v){await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({price:v})});show()}}
async function av(id,v){await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({is_available:v})});prods()}
async function del(id){if(confirm('Delete product? Past orders keep their details.')){await api('/api/admin/products/'+id,{method:'DELETE'});show()}}
$('#pf').onsubmit=async e=>{e.preventDefault();const r=await api('/api/admin/products',{method:'POST',body:new FormData(e.target)});if(r.ok){e.target.reset();show()}else alert((await r.json()).error)};
fetch('/api/admin/session').then(async r=>{if(r.ok){csrf=(await r.json()).csrf;show()}});
</script></body></html>
